name: Create repository ZIP

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repo-zip-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repo-zip:
    if: github.ref_type == 'branch'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}

      - name: Create ZIP
        run: python3 tools/create-repo-zip.py

      - name: Commit ZIP to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- JB_STORE_REPO.zip
          if git diff --cached --quiet; then
            echo "ZIP is already up to date."
          else
            git commit -m "Update repository ZIP [skip ci]"
            git push
          fi

      - name: Upload ZIP
        uses: actions/upload-artifact@v7
        with:
          name: JB_STORE_REPO
          path: JB_STORE_REPO.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
