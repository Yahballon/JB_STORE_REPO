name: Create repository ZIP

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repo-zip:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Create ZIP
        run: python3 tools/create-repo-zip.py

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: JB_STORE_REPO
          path: dist/JB_STORE_REPO.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
