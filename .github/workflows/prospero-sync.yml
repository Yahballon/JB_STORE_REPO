name: Sync ProsperoStore catalog

on:
  push:
    paths:
      - '.github/workflows/prospero-sync.yml'
      - 'tools/sync-prospero.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repo-zip-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out catalog
        uses: actions/checkout@v6
      - name: Import eligible ProsperoStore entries
        run: python3 tools/sync-prospero.py
      - name: Validate IDs and regenerate manifest + ZIP
        run: python3 tools/update-repo.py
      - name: Commit synced catalog
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- repo/ JB_STORE_REPO.zip
          if git diff --cached --quiet; then
            echo 'Catalog already up to date.'
          else
            git commit -m 'Sync ProsperoStore homebrew catalog [skip ci]'
            git push
          fi
      - name: Upload repository ZIP
        uses: actions/upload-artifact@v7
        with:
          name: JB_STORE_REPO
          path: JB_STORE_REPO.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
